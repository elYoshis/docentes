services:
  mysql:
    image: mysql:8.4
    container_name: siscobro-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: siscobro
      MYSQL_USER: siscobro
      MYSQL_PASSWORD: siscobro
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - siscobro_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  siscobro_mysql: